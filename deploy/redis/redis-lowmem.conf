# ============================================================================
# Redis 7.4 低配配置 —— 服务于「1 核 2 GB」演示部署（容器内存上限 96 MiB）
#
# 这个 Redis 同时承担两件事：
#   1) 限流滑动窗口（可以丢，丢了只是额度重置）
#   2) 评测任务队列 eval.jobs（**不能丢**，丢了任务会永远停在 PENDING）
#
# 因为把两种数据放在同一个实例里，淘汰策略只能是 noeviction：
# 一旦允许淘汰，Redis 可能把队列键清掉来给限流键腾地方——
# 那是"为了省内存而静默丢任务"，是这类系统里最不该出现的失败方式。
# ============================================================================

# ---------------------------------------------------------------------------
# 内存上限
# ---------------------------------------------------------------------------
# 容器上限 96 MiB，这里给 Redis 自身数据留 64 MiB，
# 剩余约 32 MiB 留给：进程自身开销、AOF 重写时的缓冲区、客户端输出缓冲。
# 不要把这两个值设成相等：AOF 重写（BGREWRITEAOF）期间会额外占用内存，
# 没有余量就会在重写时被 OOMKilled，而"重写时被杀"表现为随机的任务丢失。
maxmemory 64mb

# **关键**：noeviction。
# 内存写满时，写命令直接返回 OOM 错误（Java 侧会收到异常并让接口报错），
# 而不是悄悄淘汰掉队列键。宁可显式失败，也不要静默丢任务。
maxmemory-policy noeviction

# 限制所有客户端的输出缓冲总量，防止一个慢客户端把内存吃光
maxmemory-clients 8mb

# ---------------------------------------------------------------------------
# 持久化：明确的数据丢失窗口
# ---------------------------------------------------------------------------
# AOF 每秒刷盘（appendfsync everysec）→ **崩溃时最多丢最后 1 秒的写入**。
# 这是本部署对"至少一次投递"的诚实边界：
#   * Streams + PEL 保证消息在被 ACK 前一直存在；
#   * 但 Redis 进程崩溃且 AOF 未刷盘时，最后 1 秒内新入队的消息会丢。
# 所以文档里写的是"至少一次投递"，不是"绝不丢消息"。
appendonly yes
appendfsync everysec

# 关掉 RDB 快照。
# 原因：BGSAVE 会 fork 子进程，在 96 MiB 的容器里 fork 的峰值内存可能翻倍，
# 从而在"自动保存"这个最不该出问题的时刻被 OOMKilled。
# AOF 已经提供了持久化，RDB 在这里是净风险。
save ""

# AOF 重写触发条件：保持默认量级即可，演示环境写入量很小
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb

# ---------------------------------------------------------------------------
# 其它
# ---------------------------------------------------------------------------
# 演示环境没有多 DB 隔离需求，减少数量省一点结构开销
databases 4

# 缩小危险命令的暴露面：Redis 口令泄露后，FLUSHALL/FLUSHDB 能一键盘清空整个实例
# （包括未消费的评测任务），KEYS 则能一次性扫出全部键名。
# 本项目这三条都不使用（限流用 ZSET、队列用 Streams），改名不影响功能。
#
# 注意写法：**不能**把命令改成空字符串来"禁用"——Redis 7 起会直接拒绝启动。
# 必须改成一个非空的名字，这样命令仍在，只是不再叫原来的名字。
rename-command FLUSHALL "trustagent:disabled:flushall"
rename-command FLUSHDB "trustagent:disabled:flushdb"
rename-command KEYS "trustagent:disabled:keys"

# 日志到 stdout，交给 Docker 的日志轮转（见 docker-compose.lowmem.yml）
logfile ""
