# 零外部依赖的本机联调 profile：H2(文件) + 内存限流 + 内存评测队列。
# 注意：内存评测队列不会跨进程被 Python Worker 消费，异步评测必须使用 Redis（见 README「评测运行方式」）。
spring:
  datasource:
    url: jdbc:h2:file:./.data/trustagent-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

trustagent:
  runtime:
    # redis | memory —— memory 时限流与评测队列使用进程内实现
    infrastructure: memory
  security:
    # dev 下允许 H2 控制台访问（仅本机）
    expose-h2-console: true
